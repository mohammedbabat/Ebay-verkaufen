<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produkt-Lager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>
<style>
  :root{
    --ink:#1E2A38;
    --ink-2:#28384A;
    --paper:#F4F4F1;
    --card:#FFFFFF;
    --line:#DDDCD5;
    --text:#22262B;
    --muted:#6B7280;
    --teal:#3E7C7C;
    --teal-dark:#2E5E5E;
    --amber:#D98E3B;
    --red:#C1483F;
    --green:#4C8C5B;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--sans);background:var(--paper);color:var(--text);}

  /* ---- Config banner (shows until URL/Key are set) ---- */
  #configBanner{
    display:none;
    background:var(--red);color:#fff;padding:12px 20px;font-size:14px;
  }
  #configBanner code{background:rgba(255,255,255,.2);padding:2px 6px;border-radius:4px;}

  header{
    background:var(--ink);
    color:#fff;
    padding:18px 28px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:3px solid var(--teal);
  }
  header .back{
    font-family:var(--mono);font-size:12px;color:#B9C3CC;text-decoration:none;
    margin-right:16px;
  }
  header .back:hover{color:#fff;}
  header .brand{display:flex;align-items:baseline;gap:10px;}
  header h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.3px;}
  header .tag{font-family:var(--mono);font-size:11px;color:var(--teal);letter-spacing:1px;text-transform:uppercase;}
  header .count{font-family:var(--mono);font-size:13px;color:#B9C3CC;}

  .layout{
    display:grid;
    grid-template-columns: 380px 1fr;
    min-height:calc(100vh - 62px);
  }
  @media (max-width: 860px){
    .layout{grid-template-columns:1fr;}
  }

  /* ---- Left: list ---- */
  .list-panel{
    background:var(--ink-2);
    color:#fff;
    padding:18px;
    overflow-y:auto;
  }
  .search-row{display:flex;gap:8px;margin-bottom:14px;}
  .search-row input{
    flex:1;padding:9px 10px;border-radius:6px;border:1px solid #3E4E60;
    background:#22303F;color:#fff;font-family:var(--sans);font-size:13px;
  }
  .search-row input::placeholder{color:#8494A3;}
  .btn-new{
    background:var(--teal);color:#fff;border:none;border-radius:6px;
    padding:9px 14px;font-family:var(--sans);font-weight:600;font-size:13px;
    cursor:pointer;white-space:nowrap;
  }
  .btn-new:hover{background:var(--teal-dark);}

  .prod-item{
    background:#22303F;border:1px solid #35455A;border-radius:8px;
    padding:12px;margin-bottom:8px;cursor:pointer;transition:.12s border-color;
    position:relative;
  }
  .prod-item:hover{border-color:var(--teal);}
  .prod-item.active{border-color:var(--amber);background:#2B3B4E;}
  .prod-item .art{font-family:var(--mono);font-size:12px;color:var(--amber);letter-spacing:.5px;}
  .prod-item .desc{font-size:13px;margin-top:4px;color:#E4E8EC;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .prod-item .meta{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--mono);font-size:11px;color:#8494A3;}
  .stock-tag{
    font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:10px;
    background:#3E7C7C33;color:#7FCFCF;border:1px solid #3E7C7C66;
  }
  .stock-tag.low{background:#C1483F33;color:#FF9D93;border-color:#C1483F66;}
  .stock-tag.mid{background:#D98E3B33;color:#F0C583;border-color:#D98E3B66;}
  .stock-tag.good{background:#4C8C5B33;color:#8FD6A3;border-color:#4C8C5B66;}
  .empty-msg{color:#8494A3;font-size:13px;text-align:center;padding:30px 10px;}

  /* ---- Right: detail/edit ---- */
  .detail-panel{padding:28px;overflow-y:auto;}
  .placeholder{
    color:var(--muted);font-size:14px;height:100%;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;
    padding-top:60px;
  }
  .placeholder .big{font-size:38px;}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:18px;}
  .card h2{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 16px 0;font-weight:600;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field label .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .dot.low{background:var(--red);}
  .dot.mid{background:var(--amber);}
  .dot.good{background:var(--green);}
  .field input, .field textarea, .field select{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;
    font-family:var(--sans);font-size:14px;background:#FBFBFA;color:var(--text);
  }
  .field select{cursor:pointer;}
  .field.mono input{font-family:var(--mono);}
  .field textarea{min-height:90px;resize:vertical;}
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}

  .actions{display:flex;gap:10px;margin-top:6px;}
  .btn{
    padding:10px 18px;border-radius:6px;border:none;font-family:var(--sans);
    font-weight:600;font-size:13px;cursor:pointer;
  }
  .btn-save{background:var(--teal);color:#fff;}
  .btn-save:hover{background:var(--teal-dark);}
  .btn-delete{background:transparent;color:var(--red);border:1px solid var(--red);}
  .btn-delete:hover{background:var(--red);color:#fff;}
  .btn-cancel{background:transparent;color:var(--muted);border:1px solid var(--line);}

  /* ---- Images ---- */
  .img-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(120px,1fr));gap:12px;margin-bottom:14px;}
  .img-thumb{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;background:#EEECE6;}
  .img-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .img-thumb .del-img{
    position:absolute;top:5px;right:5px;background:rgba(24,24,24,.75);color:#fff;
    border:none;border-radius:5px;width:24px;height:24px;cursor:pointer;font-size:14px;line-height:1;
  }
  .img-thumb .del-img:hover{background:var(--red);}
  .upload-box{
    border:2px dashed var(--line);border-radius:8px;padding:18px;text-align:center;
    color:var(--muted);font-size:13px;cursor:pointer;
  }
  .upload-box:hover{border-color:var(--teal);color:var(--teal);}
  .upload-box input{display:none;}
  .status-msg{font-size:12px;margin-top:8px;color:var(--muted);}
  .no-images{color:var(--muted);font-size:13px;padding:10px 0;}
</style>
</head>
<body>

<div id="configBanner">
  ⚠ Supabase ist noch nicht verbunden. Öffne diese Datei im Texteditor und trage
  <code>SUPABASE_URL</code> und <code>SUPABASE_ANON_KEY</code> ganz oben im &lt;script&gt;-Bereich ein.
</div>

<header>
  <div class="brand">
    <h1>Produkt-Lager</h1>
    <span class="tag">Inventar &amp; Bilder</span>
  </div>
  <span>
    <a class="back" href="index.html">← Dashboard</a>
    <a class="back" href="lagerplan.html">Lagerplan</a>
    <a class="back" href="scan.html">📷 Scannen</a>
    <a class="back" href="etiketten.html">🏷 Etiketten</a>
    <span id="userBox" style="margin-right:14px;"></span>
    <span class="count" id="countLabel">— Artikel</span>
  </span>
</header>

<div class="layout">
  <div class="list-panel">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Suche: Artikel-Nr, EAN, Text …">
      <button class="btn-new" id="newBtn">+ Neu</button>
    </div>
    <div id="prodList"></div>
  </div>

  <div class="detail-panel" id="detailPanel">
    <div class="placeholder">
      <div class="big">📦</div>
      <div>Wähle links ein Produkt aus<br>oder lege ein neues an.</div>
    </div>
  </div>
</div>

<script>
const BUCKET = "produktbilder";
const QUELLEN = [
  {value:'', label:'— nicht ausgewählt —'},
  {value:'AB', label:'AB — Alibaba'},
  {value:'AE', label:'AE — AliExpress'},
  {value:'TE', label:'TE — Temu'},
];

function alleLagerplaetze(){
  const plaetze = [];
  for(const buchstabe of ['A','B','C','D','E']){
    for(let n=1; n<=10; n++){
      plaetze.push(buchstabe + n);
    }
  }
  return plaetze;
}
let produkte = [];
let activeId = null;   // id des aktuell geöffneten Produkts, oder "new"

function zeigeFehler(msg){
  document.getElementById('countLabel').textContent = 'Fehler';
  document.getElementById('prodList').innerHTML =
    '<div class="empty-msg" style="color:#FF9D93;">' + msg + '</div>';
}

window.addEventListener('error', function(ev){
  zeigeFehler('Skriptfehler: ' + ev.message + ' (Zeile ' + ev.lineno + ')');
});

function naechsteArtikelNummer(){
  const START = 100102;
  let hoechste = START - 1;
  produkte.forEach(p=>{
    const n = parseInt(p.artikel_nummer, 10);
    if(!isNaN(n) && n > hoechste) hoechste = n;
  });
  return String(hoechste + 1);
}

// Buttons zuerst verbinden, damit sie IMMER reagieren,
// auch wenn die Supabase-Verbindung weiter unten fehlschlägt.
document.getElementById('newBtn').addEventListener('click', ()=>{
  activeId = 'new';
  renderList();
  renderDetail({
    id:null, artikel_nummer:naechsteArtikelNummer(), ean_nummer:'', beschreibung:'',
    einkaufspreis:'', menge:'', lifewrkosten:'', endeinkaufspreis:'',
    ebay_preis:'', amazon_preis:'', bestand:'', bilder:[]
  });
});
document.getElementById('searchInput').addEventListener('input', renderList);

const FIELDS = [
  {key:'artikel_nummer', label:'Artikel Nummer', mono:true},
  {key:'ean_nummer', label:'EAN Nummer', mono:true},
  {key:'quelle', label:'Einkaufsquelle'},
  {key:'lagerplatz', label:'Lagerplatz'},
  {key:'einkaufspreis', label:'Einkaufspreis'},
  {key:'menge', label:'Menge'},
  {key:'lifewrkosten', label:'Lifewrkosten', mono:true},
  {key:'endeinkaufspreis', label:'Endeinkaufpreis', mono:true},
  {key:'ebay_preis', label:'Ebay-Verkaufpreis', mono:true},
  {key:'amazon_preis', label:'Amazon-Verkaufpreis', mono:true},
  {key:'bestand', label:'Bestand', mono:true},
];

async function loadProdukte(){
  if(!supabaseClient) return;
  try {
    const {data, error} = await supabaseClient.from('produkte').select('*').order('created_at', {ascending:false});
    if(error){ console.error(error); zeigeFehler('Datenbankfehler: ' + error.message); return; }
    produkte = data || [];
    renderList();
    oeffneProduktAusUrl();
  } catch(err){
    console.error(err);
    zeigeFehler('Verbindung fehlgeschlagen: ' + err.message);
  }
}

function oeffneProduktAusUrl(){
  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  if(id && produkte.some(p => p.id === id)){
    openProdukt(id);
  }
}

function renderList(){
  const term = document.getElementById('searchInput').value.trim().toLowerCase();
  const listEl = document.getElementById('prodList');
  const filtered = produkte.filter(p=>{
    if(!term) return true;
    return [p.artikel_nummer, p.ean_nummer, p.beschreibung].join(' ').toLowerCase().includes(term);
  });
  document.getElementById('countLabel').textContent = produkte.length + ' Artikel';

  if(filtered.length === 0){
    listEl.innerHTML = '<div class="empty-msg">Keine Produkte gefunden.</div>';
    return;
  }

  listEl.innerHTML = filtered.map(p=>{
    const stockClass = bestandsKlasse(p.bestand);
    return `
      <div class="prod-item ${p.id===activeId?'active':''}" onclick="openProdukt('${p.id}')">
        <div class="art">${escapeHtml(p.artikel_nummer||'—')}</div>
        <div class="desc">${escapeHtml(p.beschreibung||'(keine Beschreibung)')}</div>
        <div class="meta">
          <span>${(p.bilder||[]).length} Bild(er)</span>
          <span class="stock-tag ${stockClass}">Bestand: ${p.bestand ?? '—'}</span>
        </div>
      </div>`;
  }).join('');
}

function bestandsKlasse(wert){
  if(wert === null || wert === undefined || wert === '') return '';
  const b = Number(wert);
  if(isNaN(b)) return '';
  if(b < 3) return 'low';
  if(b <= 5) return 'mid';
  return 'good';
}

window.aktualisiereBestandsAmpel = function(wert){
  const dot = document.getElementById('bestandDot');
  if(!dot) return;
  dot.className = 'dot ' + bestandsKlasse(wert);
}

window.warnBeiBelegtemPlatz = function(){
  const sel = document.getElementById('f_lagerplatz');
  const warnung = document.getElementById('lagerplatzWarnung');
  if(!sel || !warnung) return;
  const gewaehlterText = sel.options[sel.selectedIndex].text;
  if(gewaehlterText.includes('(belegt:')){
    warnung.textContent = '⚠ Dieser Platz ist schon einem anderen Produkt zugewiesen.';
    warnung.style.color = 'var(--red)';
  } else {
    warnung.textContent = '';
  }
}

function zahlAusFeld(v){
  if(v === null || v === undefined || v === '') return 0;
  // falls Werte wie "0,95/7,95" oder "100/12" drinstehen, nur die erste Zahl nehmen
  const erster = String(v).split('/')[0].trim().replace(',', '.');
  const n = parseFloat(erster);
  return isNaN(n) ? 0 : n;
}

window.berechneEndeinkaufpreis = function(){
  const ekFeld = document.getElementById('f_einkaufspreis');
  const mengeFeld = document.getElementById('f_menge');
  const lwFeld = document.getElementById('f_lifewrkosten');
  const endFeld = document.getElementById('f_endeinkaufspreis');
  if(!ekFeld || !mengeFeld || !lwFeld || !endFeld) return;

  const ek = zahlAusFeld(ekFeld.value);
  const mengeRoh = zahlAusFeld(mengeFeld.value);
  const menge = mengeRoh > 0 ? mengeRoh : 1;   // leere/ungültige Menge zählt als 1, nicht als 0
  const lw = zahlAusFeld(lwFeld.value);

  const ergebnis = ek * menge + lw;
  endFeld.value = ergebnis.toFixed(2).replace('.', ',');
  zeigeMengenHinweis();
}

window.zeigeMengenHinweis = function(){
  const ekFeld = document.getElementById('f_einkaufspreis');
  const hinweisEl = document.getElementById('mengenHinweis');
  if(!ekFeld || !hinweisEl) return;
  const teile = ekFeld.value.split('/').map(s=>s.trim()).filter(Boolean);
  if(teile.length >= 2){
    const einzelpreis = parseFloat(teile[0].replace(',', '.'));
    const packpreis = parseFloat(teile[1].replace(',', '.'));
    if(!isNaN(einzelpreis) && !isNaN(packpreis) && einzelpreis > 0){
      hinweisEl.textContent = `Hinweis: ${teile[0]} € pro Stück einzeln, ${teile[1]} € im größeren Paket erkannt — es wird aktuell mit ${teile[0]} € gerechnet.`;
    } else {
      hinweisEl.textContent = '';
    }
  } else {
    hinweisEl.textContent = '';
  }
}

window.generiereEAN = function(){
  const artFeld = document.getElementById('f_artikel_nummer');
  const eanFeld = document.getElementById('f_ean_nummer');
  if(!artFeld || !eanFeld) return;

  // Nur Ziffern aus der Artikelnummer nehmen, auf 9 Stellen auffüllen
  let ziffern = String(artFeld.value || '').replace(/\D/g, '');
  if(!ziffern) ziffern = String(Date.now()).slice(-9);
  const kern = ziffern.padStart(9, '0').slice(-9);

  // "200" = GS1-Bereich für firmeninterne Nutzung (nicht öffentlich registriert,
  // kollidiert daher nicht mit echten Produkt-EANs)
  const zwoelf = '200' + kern;

  // EAN-13 Prüfziffer berechnen
  let summe = 0;
  for(let i=0; i<12; i++){
    const ziffer = parseInt(zwoelf[i], 10);
    summe += (i % 2 === 0) ? ziffer * 1 : ziffer * 3;
  }
  const pruefziffer = (10 - (summe % 10)) % 10;

  eanFeld.value = zwoelf + pruefziffer;
}

function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

window.openProdukt = function(id){
  activeId = id;
  renderList();
  const p = produkte.find(x=>x.id===id);
  renderDetail(p);
}

function renderDetail(p){
  const isNew = !p.id;
  const panel = document.getElementById('detailPanel');

  const fieldsHtml = FIELDS.map(f=>{
    if(f.key === 'ean_nummer'){
      return `
        <div class="field mono">
          <label>${f.label}</label>
          <div style="display:flex;gap:6px;">
            <input type="text" id="f_ean_nummer" value="${escapeHtml(p.ean_nummer)}" style="flex:1;">
            <button type="button" onclick="generiereEAN()" style="white-space:nowrap;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:#F7F6F2;font-family:var(--sans);font-size:12px;cursor:pointer;">🔄 Generieren</button>
          </div>
        </div>
      `;
    }
    if(f.key === 'lagerplatz'){
      const belegtVon = {};
      produkte.forEach(other=>{
        if(other.id !== p.id && other.lagerplatz){
          belegtVon[other.lagerplatz] = other.artikel_nummer || other.id;
        }
      });
      const optionsHtml = ['<option value="">— nicht zugewiesen —</option>']
        .concat(alleLagerplaetze().map(platz=>{
          const belegt = belegtVon[platz];
          const label = belegt ? `${platz} (belegt: ${belegt})` : platz;
          return `<option value="${platz}" ${p.lagerplatz===platz?'selected':''}>${escapeHtml(label)}</option>`;
        })).join('');
      return `
        <div class="field">
          <label>${f.label}</label>
          <select id="f_lagerplatz" onchange="warnBeiBelegtemPlatz()">${optionsHtml}</select>
          <div class="status-msg" id="lagerplatzWarnung"></div>
        </div>
      `;
    }
    if(f.key === 'quelle'){
      const optionsHtml = QUELLEN.map(q =>
        `<option value="${q.value}" ${p.quelle===q.value?'selected':''}>${escapeHtml(q.label)}</option>`
      ).join('');
      return `
        <div class="field">
          <label>${f.label}</label>
          <select id="f_quelle">${optionsHtml}</select>
        </div>
      `;
    }
    if(f.key === 'bestand'){
      return `
        <div class="field mono">
          <label><span class="dot" id="bestandDot"></span>Bestand</label>
          <input type="text" id="f_bestand" value="${escapeHtml(p.bestand)}" oninput="aktualisiereBestandsAmpel(this.value)">
        </div>
      `;
    }
    if(f.key === 'einkaufspreis' || f.key === 'menge' || f.key === 'lifewrkosten'){
      const hinweisId = f.key === 'einkaufspreis' ? 'id="mengenHinweis"' : '';
      return `
        <div class="field ${f.mono?'mono':''}">
          <label>${f.label}</label>
          <input type="text" id="f_${f.key}" value="${escapeHtml(p[f.key])}" oninput="berechneEndeinkaufpreis()">
          ${f.key === 'einkaufspreis' ? `<div class="status-msg" ${hinweisId}></div>` : ''}
        </div>
      `;
    }
    if(f.key === 'endeinkaufspreis'){
      return `
        <div class="field mono">
          <label>Endeinkaufpreis <span style="font-weight:400;color:var(--muted);">(automatisch, editierbar)</span></label>
          <input type="text" id="f_endeinkaufspreis" value="${escapeHtml(p.endeinkaufspreis)}">
        </div>
      `;
    }
    return `
    <div class="field ${f.mono?'mono':''}">
      <label>${f.label}</label>
      <input type="text" id="f_${f.key}" value="${escapeHtml(p[f.key])}">
    </div>
  `;
  }).join('');

  panel.innerHTML = `
    <div class="card">
      <h2>Bilder</h2>
      <div class="img-grid" id="imgGrid"></div>
      <label class="upload-box" id="uploadBox">
        + Bild hinzufügen (klicken oder mehrere auswählen)
        <input type="file" id="fileInput" accept="image/*" multiple ${isNew?'disabled':''}>
      </label>
      ${isNew ? '<div class="status-msg">Speichere das Produkt zuerst, dann kannst du Bilder hochladen.</div>' : ''}
      <div class="status-msg" id="uploadStatus"></div>
    </div>

    <div class="card">
      <h2>${isNew ? 'Neues Produkt' : 'Produktdaten bearbeiten'}</h2>
      <div class="field">
        <label>Produktbeschreibung</label>
        <textarea id="f_beschreibung">${escapeHtml(p.beschreibung)}</textarea>
      </div>
      <div class="grid2">${fieldsHtml}</div>
      <div class="actions">
        <button class="btn btn-save" id="saveBtn">${isNew?'Anlegen':'Speichern'}</button>
        ${!isNew ? '<button class="btn btn-delete" id="deleteBtn">Löschen</button>' : ''}
      </div>
    </div>
  `;

  renderImages(p.bilder||[], p.id);
  aktualisiereBestandsAmpel(p.bestand);
  zeigeMengenHinweis();

  document.getElementById('saveBtn').addEventListener('click', ()=>saveProdukt(p));
  if(!isNew){
    document.getElementById('deleteBtn').addEventListener('click', ()=>deleteProdukt(p.id));
    document.getElementById('fileInput').addEventListener('change', (e)=>uploadImages(e, p.id));
  }
}

function renderImages(bilder, produktId){
  const grid = document.getElementById('imgGrid');
  if(!bilder || bilder.length===0){
    grid.innerHTML = '<div class="no-images">Noch keine Bilder hochgeladen.</div>';
    return;
  }
  grid.innerHTML = bilder.map(url=>`
    <div class="img-thumb">
      <img src="${url}" loading="lazy">
      <button class="del-img" onclick="deleteImage('${produktId}', '${url}')" title="Bild löschen">✕</button>
    </div>
  `).join('');
}

async function protokolliere(produktId, artikelNummer, aktion, menge){
  try {
    await supabaseClient.from('bewegungen').insert({
      produkt_id: produktId,
      artikel_nummer: artikelNummer,
      mitarbeiter: aktuellerName,
      aktion: aktion,
      menge: menge ?? null
    });
  } catch(err){ console.error('Protokoll-Fehler:', err); }
}

async function saveProdukt(existing){
  const payload = {};
  FIELDS.forEach(f=>{
    let val = document.getElementById('f_'+f.key).value.trim();
    payload[f.key] = val === '' ? null : val;
  });
  // Zahlenfelder konvertieren
  ['lifewrkosten','endeinkaufspreis','ebay_preis','amazon_preis','bestand'].forEach(k=>{
    if(payload[k] !== null){
      const num = Number(payload[k].toString().replace(',', '.'));
      payload[k] = isNaN(num) ? null : num;
    }
  });
  payload.beschreibung = document.getElementById('f_beschreibung').value.trim();
  payload.updated_at = new Date().toISOString();

  if(!existing.id){
    const {data, error} = await supabaseClient.from('produkte').insert(payload).select().single();
    if(error){ alert('Fehler beim Anlegen: '+error.message); return; }
    activeId = data.id;
    await protokolliere(data.id, data.artikel_nummer, 'angelegt');
    await loadProdukte();
    openProdukt(data.id);
  } else {
    const {error} = await supabaseClient.from('produkte').update(payload).eq('id', existing.id);
    if(error){ alert('Fehler beim Speichern: '+error.message); return; }
    await protokolliere(existing.id, payload.artikel_nummer, 'bearbeitet');
    await loadProdukte();
    openProdukt(existing.id);
  }
}

async function deleteProdukt(id){
  if(!confirm('Dieses Produkt wirklich löschen? Das kann nicht rückgängig gemacht werden.')) return;
  const {error} = await supabaseClient.from('produkte').delete().eq('id', id);
  if(error){ alert('Fehler beim Löschen: '+error.message); return; }
  activeId = null;
  await loadProdukte();
  document.getElementById('detailPanel').innerHTML = `
    <div class="placeholder"><div class="big">📦</div><div>Wähle links ein Produkt aus<br>oder lege ein neues an.</div></div>`;
}

async function uploadImages(e, produktId){
  const files = Array.from(e.target.files || []);
  if(files.length===0) return;
  const statusEl = document.getElementById('uploadStatus');
  statusEl.textContent = 'Lade hoch …';

  const p = produkte.find(x=>x.id===produktId);
  const currentImgs = [...(p.bilder||[])];

  for(const file of files){
    const path = `${produktId}/${Date.now()}_${file.name}`;
    const {error: upErr} = await supabaseClient.storage.from(BUCKET).upload(path, file);
    if(upErr){ statusEl.textContent = 'Fehler: '+upErr.message; continue; }
    const {data: pub} = supabaseClient.storage.from(BUCKET).getPublicUrl(path);
    currentImgs.push(pub.publicUrl);
  }

  const {error: updErr} = await supabaseClient.from('produkte').update({bilder: currentImgs}).eq('id', produktId);
  if(updErr){ statusEl.textContent = 'Fehler beim Speichern der Bild-Liste: '+updErr.message; return; }

  statusEl.textContent = 'Fertig hochgeladen.';
  await loadProdukte();
  openProdukt(produktId);
}

window.deleteImage = async function(produktId, url){
  if(!confirm('Dieses Bild löschen?')) return;
  const p = produkte.find(x=>x.id===produktId);
  const newImgs = (p.bilder||[]).filter(u=>u!==url);

  // Storage-Pfad aus der öffentlichen URL extrahieren
  const marker = `/${BUCKET}/`;
  const idx = url.indexOf(marker);
  if(idx !== -1){
    const path = url.substring(idx + marker.length);
    await supabaseClient.storage.from(BUCKET).remove([path]);
  }

  const {error} = await supabaseClient.from('produkte').update({bilder: newImgs}).eq('id', produktId);
  if(error){ alert('Fehler beim Löschen: '+error.message); return; }
  await loadProdukte();
  openProdukt(produktId);
};
